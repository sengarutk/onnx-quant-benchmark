[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-edge-inference-benchmark"
version = "2.0.1"
description = "Reproducible benchmark of PyTorch vs ONNX Runtime (FP32/FP16/static INT8) edge-vision inference: latency, stability, parity, task quality, and quantization-aware post-processing"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Utkarsh Sengar" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.19.0",
    "onnxsim>=0.4.36",
    "onnxconverter-common>=1.14.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.535.0",
    "threadpoolctl>=3.1.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0"]

[project.urls]
Repository = "https://github.com/sengarutk/onnx-quant-benchmark"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = ["artifacts: needs generated data/trained weights/exported models (skipped when absent)"]
filterwarnings = ["ignore:The pynvml package is deprecated:FutureWarning"]

[tool.coverage.run]
source = ["src"]
