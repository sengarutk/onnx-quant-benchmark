# Acceptance gates for FP32 artifacts of this model, measured against PyTorch FP32 on CPU.
# Applied to every runtime that executes this precision (scripts/benchmark_all.py).
model:
  name: "yolo_nano"
  task: "detection"
  input_shape: [1, 3, 640, 640]
  weights_path: "models/weights/yolo_nano_trained.pt"
  opset: 17
  class_names: ["rectangle", "ellipse"]
  conf_threshold: 0.25
  iou_threshold: 0.45

quality_thresholds:
  max_rel_error: 1.0e-4            # max |candidate - reference| / max|reference| over all outputs
  min_cosine_similarity: 0.99999
  max_map_drop: 0.001
