# Benchmark protocol consumed by scripts/benchmark_all.py
benchmark:
  batch_size: 1
  warmup_iterations: 50          # untimed model-path iterations per session
  timed_iterations: 300          # timed model-path iterations per session
  stability_sessions: 5          # + 2 supplemental sessions if the session-median CV exceeds 0.04
  cooldown_seconds: 0.5
  e2e_warmup_iterations: 20
  e2e_timed_iterations: 200      # cycles through the 200-image test split
  cv_threshold: 0.05             # stability verdict: CV of session medians <= 0.05
  device_id: 0

paths:
  weights_dir: "models/weights"
  exported_dir: "models/exported"
  engines_dir: "models/engines"
  results_raw: "results/raw"
  results_manifests: "results/manifests"
  results_tables: "results/tables"
  results_figures: "results/figures"
  results_profiles: "results/profiles"
  calibration_data: "data/calibration"
  sample_data: "data/sample_images"
