# Acceptance gates for INT8 artifacts of this model, measured against PyTorch FP32 on CPU.
# Applied to every runtime that executes this precision (scripts/benchmark_all.py).
model:
  name: "industrial_autoencoder"
  task: "anomaly_detection"
  input_shape: [1, 3, 256, 256]
  weights_path: "models/weights/industrial_autoencoder_trained.pt"
  opset: 17
  class_names: []

quality_thresholds:
  max_rel_error: 1.0e-1            # max |candidate - reference| / max|reference| over all outputs
  min_cosine_similarity: 0.99
  max_auroc_drop: 0.02
